<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="ConstructClaim local-only construction claim workflow demo">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <title>ConstructClaim — Demo</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Desktop navigation">
      <a class="brand" href="#home" aria-label="ConstructClaim demo home"><img src="./icon.svg" width="36" height="36" alt=""><span>Construct<span class="brand-blue">Claim</span><small>Local demo workspace</small></span></a>
      <nav id="desktop-nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-foot"><span class="demo-pill">DEMO</span><p>Synthetic records<br>Work saved on this device</p></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Expand navigation" aria-controls="desktop-nav" aria-expanded="false"></button>
        <a class="mobile-brand brand" href="#home" aria-label="ConstructClaim demo home"><img src="./icon.svg" width="28" height="28" alt=""><span>Construct<span class="brand-blue">Claim</span></span></a>
        <span class="topbar-label">Atlas Construction <span class="demo-pill">DEMO</span></span>
        <div class="utility-actions"><a class="connection" href="#offline" data-connectivity></a><a class="topbar-link" href="#offline"><span class="draft-label">Device drafts</span> <span id="draft-count">0</span></a><span class="avatar" aria-label="Demo user Alex Lee">AL</span></div>
      </header>
      <div class="demo-notice" role="note"><span>Synthetic examples · Device-local demo</span><a href="#settings">Demo details</a></div>
      <div id="update-notice" class="update-notice" hidden role="status"><span id="update-message"></span><a href="#settings">App status</a></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <button class="scroll-top" id="scroll-top" type="button" hidden aria-label="Scroll to top"></button>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="update-overlay" class="update-overlay" hidden role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><strong>Updating ConstructClaim demo…</strong></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
